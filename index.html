<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Tracker Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'media',
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            /* iframe内でのスクロールを考慮 */
            overflow-y: auto; 
        }
        
        /* 透け感のあるパネルデザイン */
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        @media (prefers-color-scheme: dark) {
            .glass-panel {
                background: rgba(30, 30, 30, 0.9);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            ::-webkit-scrollbar-thumb {
                background: rgba(255, 255, 255, 0.2);
            }
        }
    </style>
</head>
<body class="flex items-start justify-center min-h-screen m-0 p-4 transition-colors duration-300">
    
    <div class="glass-panel w-full max-w-md rounded-2xl shadow-sm p-5 text-gray-800 dark:text-gray-200">
        <h2 class="text-lg font-semibold mb-4 text-center">活動記録</h2>
        
        <!-- 入力フォーム -->
        <div class="space-y-3 mb-5">
            <div class="flex items-center space-x-2 relative">
                <!-- Start Time Custom Select -->
                <div class="relative flex-1">
                    <button id="start-time-btn" type="button" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-2 text-sm text-left outline-none focus:border-blue-500 dark:focus:border-blue-400 transition-colors cursor-pointer flex justify-between items-center">
                        <span id="start-time-display">09:00</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </button>
                    <ul id="start-time-list" class="absolute z-10 hidden w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg mt-1 max-h-48 overflow-y-auto shadow-lg py-1"></ul>
                </div>
                
                <span class="text-gray-400 font-medium">〜</span>
                
                <!-- End Time Custom Select -->
                <div class="relative flex-1">
                    <button id="end-time-btn" type="button" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-2 text-sm text-left outline-none focus:border-blue-500 dark:focus:border-blue-400 transition-colors cursor-pointer flex justify-between items-center">
                        <span id="end-time-display">10:00</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </button>
                    <ul id="end-time-list" class="absolute z-10 hidden w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg mt-1 max-h-48 overflow-y-auto shadow-lg py-1"></ul>
                </div>
            </div>
            
            <div class="flex space-x-2">
                <input type="text" id="activity-desc" placeholder="活動内容 (例: ミーティング)" class="flex-1 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-2 text-sm outline-none focus:border-blue-500 dark:focus:border-blue-400 transition-colors">
                <button id="add-btn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors whitespace-nowrap shadow-sm">
                    追加
                </button>
            </div>
        </div>

        <hr class="border-gray-200 dark:border-gray-700 mb-4">

        <!-- 記録リスト -->
        <div class="mb-4">
            <h3 class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-2 uppercase tracking-wider">今日の記録</h3>
            <ul id="activity-list" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                <li id="empty-message" class="text-sm text-gray-400 dark:text-gray-500 text-center py-4">まだ記録がありません</li>
            </ul>
        </div>

        <!-- 出力エリア -->
        <div class="relative">
            <textarea id="output-text" class="w-full h-32 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-3 text-sm font-mono outline-none resize-y" placeholder="ここにテキストが出力されます..."></textarea>
            <div class="absolute bottom-3 right-3">
                <button id="copy-btn" class="bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 border border-gray-200 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600 px-3 py-1.5 rounded-md text-xs font-medium transition-colors shadow-sm flex items-center space-x-1 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                    </svg>
                    <span id="copy-text">コピー</span>
                </button>
            </div>
        </div>

        <!-- 通知メッセージ用 -->
        <div id="toast" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg text-sm shadow-lg opacity-0 pointer-events-none transition-opacity duration-300">
            コピーしました！
        </div>
    </div>

    <script>
        const activityDescInput = document.getElementById('activity-desc');
        const addBtn = document.getElementById('add-btn');
        const activityList = document.getElementById('activity-list');
        const emptyMessage = document.getElementById('empty-message');
        const outputText = document.getElementById('output-text');
        const copyBtn = document.getElementById('copy-btn');
        const copyText = document.getElementById('copy-text');
        const toast = document.getElementById('toast');

        // カスタムセレクト用の要素
        const startTimeDisplay = document.getElementById('start-time-display');
        const endTimeDisplay = document.getElementById('end-time-display');
        const startTimeBtn = document.getElementById('start-time-btn');
        const endTimeBtn = document.getElementById('end-time-btn');
        const startTimeList = document.getElementById('start-time-list');
        const endTimeList = document.getElementById('end-time-list');

        let activities = [];
        let currentStartTime = "09:00";
        let currentEndTime = "10:00";

        // 15分刻みの時間オプションを生成
        function generateTimeOptions() {
            const options = [];
            for (let h = 0; h < 24; h++) {
                for (let m = 0; m < 60; m += 15) {
                    const hh = h.toString().padStart(2, '0');
                    const mm = m.toString().padStart(2, '0');
                    options.push(`${hh}:${mm}`);
                }
            }
            return options;
        }

        const timeOptions = generateTimeOptions();

        // カスタムドロップダウンを初期化
        function initCustomSelect(listEl, displayEl, btnEl, isStart) {
            listEl.innerHTML = '';
            timeOptions.forEach(time => {
                const li = document.createElement('li');
                li.className = 'px-3 py-1.5 text-sm cursor-pointer hover:bg-blue-50 dark:hover:bg-gray-700 transition-colors';
                li.dataset.value = time;
                li.innerText = time;
                
                li.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (isStart) {
                        currentStartTime = time;
                        displayEl.innerText = time;
                    } else {
                        currentEndTime = time;
                        displayEl.innerText = time;
                    }
                    listEl.classList.add('hidden');
                });
                
                listEl.appendChild(li);
            });
            
            btnEl.addEventListener('click', (e) => {
                e.stopPropagation();
                
                // もう一方のリストが開いていたら閉じる
                if (isStart) endTimeList.classList.add('hidden');
                else startTimeList.classList.add('hidden');
                
                const isHidden = listEl.classList.contains('hidden');
                if (isHidden) {
                    listEl.classList.remove('hidden');
                    // ★ 開いた時に、選択中の項目が一番上にくるようにスクロール位置を調整
                    const currentValue = isStart ? currentStartTime : currentEndTime;
                    const selectedLi = listEl.querySelector(`li[data-value="${currentValue}"]`);
                    if (selectedLi) {
                        listEl.scrollTop = selectedLi.offsetTop;
                    }
                } else {
                    listEl.classList.add('hidden');
                }
            });
        }

        // 画面外クリックでドロップダウンを閉じる
        document.addEventListener('click', () => {
            startTimeList.classList.add('hidden');
            endTimeList.classList.add('hidden');
        });

        // 活動を追加
        function addActivity() {
            const start = currentStartTime;
            const end = currentEndTime;
            const desc = activityDescInput.value.trim();

            // 次の開始時間を、今の終了時間に自動セットして入力しやすくする
            currentStartTime = end;
            startTimeDisplay.innerText = currentStartTime;

            activities.push({ start, end, desc });
            activityDescInput.value = '';
            
            renderList();
            updateOutput();
        }

        // 記録を削除
        function removeActivity(index) {
            activities.splice(index, 1);
            renderList();
            updateOutput();
        }

        // リストを描画
        function renderList() {
            // 既存のリストアイテムをクリア（Emptyメッセージ以外）
            activityList.innerHTML = '';

            if (activities.length === 0) {
                activityList.appendChild(emptyMessage);
                emptyMessage.style.display = 'block';
                return;
            }

            emptyMessage.style.display = 'none';

            activities.forEach((activity, index) => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-white dark:bg-gray-700/50 p-2 rounded-lg border border-gray-100 dark:border-gray-700 shadow-sm text-sm";
                
                li.innerHTML = `
                    <div class="flex-1 truncate mr-2">
                        <span class="font-mono text-gray-500 dark:text-gray-400 mr-2">${activity.start}-${activity.end}</span>
                        <span class="font-medium">${activity.desc}</span>
                    </div>
                    <button onclick="removeActivity(${index})" class="text-gray-400 hover:text-red-500 transition-colors p-1" title="削除">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                `;
                activityList.appendChild(li);
            });
        }

        // テキストエリアを更新
        function updateOutput() {
            if (activities.length === 0) {
                outputText.value = '';
                copyBtn.disabled = true;
                return;
            }

            const text = activities.map(a => {
                return a.desc ? `${a.start} - ${a.end} ${a.desc}` : `${a.start} - ${a.end}`;
            }).join('\n');
            outputText.value = text;
            copyBtn.disabled = false;
        }

        // クリップボードにコピー
        function copyToClipboard() {
            if (activities.length === 0) return;

            const textToCopy = outputText.value;
            
            // iFrame環境（Notion等）での互換性を高めるためのexecCommandアプローチ
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            // 画面外に配置
            textArea.style.position = "absolute";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('コピーに失敗しました', err);
            }
            
            document.body.removeChild(textArea);
        }

        // トースト通知を表示
        function showToast() {
            copyText.innerText = "完了！";
            toast.style.opacity = '1';
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => {
                    copyText.innerText = "コピー";
                }, 300); // フェードアウト後にテキストを戻す
            }, 2000);
        }

        // イベントリスナー
        addBtn.addEventListener('click', addActivity);
        activityDescInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addActivity();
        });
        copyBtn.addEventListener('click', copyToClipboard);

        // 初期化実行
        initCustomSelect(startTimeList, startTimeDisplay, startTimeBtn, true);
        initCustomSelect(endTimeList, endTimeDisplay, endTimeBtn, false);
        updateOutput();
    </script>
</body>
</html>
